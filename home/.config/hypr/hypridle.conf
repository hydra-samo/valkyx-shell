# VALKYX idle — lock after 5 min, panel off after 10.
# Lid close = suspend only (no lock before sleep).

general {
    ignore_dbus_inhibit = false
    # No `pidof hyprlock ||` short-circuit any more. That guard meant a hyprlock
    # left over from a revoked session-lock grant was never cleared, so the next
    # Lock press hit "a lockscreen is already running" and did nothing.
    # valkyx-lock now detects and clears a stale holder itself.
    lock_cmd = $HOME/.local/bin/valkyx-lock
    # Lock on wake, through the same self-healing entry point. /sys/power/
    # mem_sleep here is s2idle only, so user space keeps ticking through the
    # "sleep" — an idle timer that expires in there starts hyprlock while the
    # compositor is mid-transition, the session-lock grant gets revoked, and
    # the session is left locked with nothing drawing. Asking for the lock here,
    # at a moment we know the compositor is back, avoids that entirely.
    # NOTHING runs on resume from here. after_sleep_cmd and on-resume both need
    # hypridle to be alive, and Caffeine kills hypridle on this box (the unit has
    # 0 journal entries — it has never started), so both were dead code that only
    # LOOKED like it handled wake. The Suspend button blanks the panel with
    # `dpms off`, so waking to a black screen was simply the dpms restore never
    # running. Panel-on and lock-on-wake now both live in
    # /usr/lib/systemd/system-sleep/valkyx-wake-lock, which Caffeine cannot disarm
    # and which systemd actually executes. Do not re-add them here.
}

listener {
    timeout = 300
    on-timeout = lock_cmd
}

# The old 600s "blank the screen" listener called `valkyx-dispatch dpms`, but that
# shim only speaks workspace/movetoworkspace — dpms is rejected, so it never
# blanked anything while looking like it did. `hyprctl dispatch dpms` is
# rejected outright on 0.56.2 and there is no hl.dsp equivalent.
# It was also redundant: the 300s listener above already locks, and hyprlock
# blanks the display. The suspend path is handled by the systemd sleep hook
# valkyx-wake-lock, which Caffeine cannot disarm. Do not re-add dpms here.
