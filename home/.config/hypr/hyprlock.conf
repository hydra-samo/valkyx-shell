# HYDRA lock — Omarchy-style, theme-following (generated by hydra-lock).

general {
    ignore_empty_input = true
}

background {
    monitor =
    path = /home/hydrasamo/.local/share/backgrounds/hydra-samo-wallpaper.png
    color = rgba(10, 18, 16, 1.0)
    # 2 passes, not 4. The full-screen blur is the single most expensive thing
    # hyprlock draws, and it composites BEFORE the labels and input field, so a
    # 4-pass blur means the first visible frame is the near-black background
    # plus one accent-outlined 320x56 pill — a lone glowing dash on black. It is
    # what made suspend/resume look like a flickering screen instead of a lock.
    # At blur_size 8 the visual difference from 4 passes is negligible.
    blur_size = 8
    blur_passes = 2
}

shape {
    monitor =
    size = 100%, 100%
    position = 0, 0
    halign = center
    valign = center
    rounding = 0
    color = rgba(9, 15, 13, 0.32)
}

label {
    monitor =
    text = HYDRA SAMO
    color = rgba(236, 241, 239, 0.92)
    font_size = 56
    font_family = Space Grotesk Bold
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = LABS
    color = rgba(70, 118, 183, 1.0)
    font_size = 16
    font_family = Space Grotesk Medium
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    position = 0, -8
    halign = center
    valign = center
    rounding = 28
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.5
    dots_center = true
    fade_on_empty = false
    placeholder_text = password
    hide_input = false
    outer_color = rgba(70, 118, 183, 1.0)
    inner_color = rgba(13, 20, 18, 0.78)
    font_color = rgba(236, 241, 239, 0.92)
    font_family = Space Grotesk
    check_color = rgba(70, 118, 183, 1.0)
    fail_color = rgba(224, 108, 108, 1.0)
    fail_text = <i>FAILED ($ATTEMPTS)</i>
    swap_font_color = false
    # 1 pass, not 4 — same reason as the background: every extra pass delays the
    # first complete frame, and this shadow is the brightest thing on screen.
    shadow_passes = 1
    shadow_size = 10
    shadow_color = rgba(70, 118, 183, 0.55)
}

label {
    monitor =
    text = cmd[update:10000] date +"%H:%M"
    color = rgba(236, 241, 239, 0.92)
    font_size = 29
    font_family = JetBrainsMono Nerd Font
    position = -20, -18
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%a %d %b"
    color = rgba(200, 210, 205, 0.65)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -20, -56
    halign = right
    valign = top
}

label {
    monitor =
    text = hydrasamo
    color = rgba(236, 241, 239, 0.92)
    font_size = 15
    font_family = Space Grotesk Bold
    position = 26, 24
    halign = left
    valign = bottom
}

label {
    monitor =
    text = Hyprland  ·  Wayland
    color = rgba(200, 210, 205, 0.65)
    font_size = 10
    font_family = Space Grotesk
    position = 26, 44
    halign = left
    valign = bottom
}
